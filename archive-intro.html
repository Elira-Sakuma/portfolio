<!DOCTYPE html>
<!-- ============================================================
     PAGE ID: ARCHIVE-INTRO
     这是【档案导入页】——带有Live2D角色和狙击光标效果的入场页。
     点击后跳转到主页 ecosystem.html。
     请勿将其他页面的内容覆盖到此文件。
     ============================================================ -->
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE // Ellen Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=Noto+Sans+SC:wght@300;400;500;700;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-base: #08080c;
      --bg-card: #0F0F14;
      --zzz-yellow: #FFD93D;
      --neon-cyan: #00F5FF;
      --neon-purple: #B14EFF;
      --archive-red: #8B1A1A;
      --archive-cream: #C4B59A;
      --archive-stamp: #D44638;
      --archive-aged: #5A5048;
      --text-primary: #F0F0F0;
      --text-secondary: #888;
      --text-tertiary: #555;
      --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition-fast: 0.2s ease;
      --transition-base: 0.4s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    /* ===== CLIP PATHS ===== */
    .cut-tl-br { clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
    .cut-all-sm { clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }

    /* ===== LOADING SCREEN ===== */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Scan line sweep */
    .load-scan {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--zzz-yellow), transparent);
      opacity: 0;
      animation: scan-sweep 0.8s ease-out forwards;
    }

    @keyframes scan-sweep {
      0% { top: 0; opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { top: 100%; opacity: 0; }
    }

    /* Loading text */
    .load-text {
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.3em;
      color: var(--zzz-yellow);
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0;
      animation: fade-in 0.4s ease 0.3s forwards;
      min-height: 20px;
    }

    .load-text-cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--zzz-yellow);
      margin-left: 4px;
      animation: blink 0.6s steps(2) infinite;
      vertical-align: middle;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fade-in { to { opacity: 1; } }

    /* Progress bar */
    .load-progress-wrap {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      opacity: 0;
      animation: fade-in 0.4s ease 0.6s forwards;
    }

    .load-progress-bar {
      width: 0%;
      height: 100%;
      background: var(--zzz-yellow);
      transition: width 0.3s ease;
    }

    .load-progress-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 12px;
      letter-spacing: 0.2em;
      opacity: 0;
      animation: fade-in 0.4s ease 0.6s forwards;
    }

    /* CRT lines on loading screen */
    .load-crt {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(255, 255, 255, 0.02) 2px,
        rgba(255, 255, 255, 0.02) 3px
      );
    }

    /* ===== ARCHIVE PAGE ===== */
    #archive-page {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }

    #archive-page.active {
      opacity: 1;
      visibility: visible;
    }

    /* Tear reveal animation */
    .archive-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
      animation: tear-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    #archive-page.active .archive-inner {
      animation: tear-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    @keyframes tear-reveal {
      0% {
        clip-path: polygon(0 100%, 100% 100%, 100% 98%, 0 100%);
        transform: translateY(20px);
        filter: brightness(0.3) contrast(1.5);
      }
      40% {
        clip-path: polygon(0 100%, 100% 100%, 100% 50%, 0 55%);
        transform: translateY(10px);
        filter: brightness(0.7) contrast(1.2);
      }
      60% {
        clip-path: polygon(0 100%, 100% 100%, 100% 30%, 0 35%);
        transform: translateY(3px) translateX(-1px);
        filter: brightness(0.9);
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: translateY(0);
        filter: brightness(1);
      }
    }

    /* Archive frame */
    .archive-frame {
      position: relative;
      width: 90vw;
      max-width: 1400px;
      height: 88vh;
      max-height: 820px;
      background: var(--bg-card);
    }

    /* Decorative corners */
    .archive-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 5;
    }
    .archive-corner svg { width: 100%; height: 100%; }
    .corner-tl { top: -1px; left: -1px; }
    .corner-tr { top: -1px; right: -1px; transform: scaleX(-1); }
    .corner-bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
    .corner-br { bottom: -1px; right: -1px; transform: scale(-1, -1); }

    /* Main image area */
    .archive-image-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0e 0%, #12121a 50%, #0d0d12 100%);
    }

    /* Character video — breathing live effect */
    .archive-character {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 65% 25%;
      filter: brightness(0.8) contrast(1.15) saturate(0.85);
      animation: character-fadein 1s ease 0.8s both;
    }

    /* Ripple click guide — positioned at character's eye, follows character motion */
    .ripple-guide {
      position: absolute;
      top: 30%;
      left: 58%;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.4s ease;
      transform: translate(-50%, -50%);
      animation: eye-track 6s ease-in-out infinite;
    }

    .archive-image-area:hover .ripple-guide {
      opacity: 1;
    }

    /* Simulate tracking the Live2D character's eye movement
       — subtle sway matching the video's 6s breathing/sway cycle */
    @keyframes eye-track {
      0%   { transform: translate(-50%, -50%) translate(0px, 0px); }
      15%  { transform: translate(-50%, -50%) translate(3px, -2px); }
      30%  { transform: translate(-50%, -50%) translate(5px, 1px); }
      45%  { transform: translate(-50%, -50%) translate(2px, 3px); }
      50%  { transform: translate(-50%, -50%) translate(0px, 2px); }
      65%  { transform: translate(-50%, -50%) translate(-3px, 0px); }
      80%  { transform: translate(-50%, -50%) translate(-4px, -2px); }
      100% { transform: translate(-50%, -50%) translate(0px, 0px); }
    }

    .ripple-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border: 1.5px solid rgba(255, 217, 61, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: ripple-expand 2s ease-out infinite;
    }

    .ripple-ring:nth-child(2) { animation-delay: 0.6s; }
    .ripple-ring:nth-child(3) { animation-delay: 1.2s; }

    @keyframes ripple-expand {
      0% {
        width: 20px;
        height: 20px;
        border-color: rgba(255, 217, 61, 0.7);
        opacity: 0.8;
      }
      100% {
        width: 120px;
        height: 120px;
        border-color: rgba(255, 217, 61, 0.05);
        opacity: 0;
      }
    }

    /* Click pulse — at character's eye */
    .ripple-click {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid var(--zzz-yellow);
      border-radius: 50%;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transform: translate(-50%, -50%);
    }
    .ripple-click.active { animation: click-burst 0.6s ease-out forwards; }

    @keyframes click-burst {
      0% { width: 40px; height: 40px; opacity: 1; border-width: 2px; }
      100% { width: 200px; height: 200px; opacity: 0; border-width: 1px; }
    }

    /* Cursor hint — at character's eye */
    .cursor-hint {
      position: absolute;
      top: 30%;
      left: 58%;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      animation: eye-track 6s ease-in-out infinite;
    }
    .archive-image-area:hover .cursor-hint {
      opacity: 0.6;
      animation: eye-track 6s ease-in-out infinite, hint-pulse-opacity 1.5s ease-in-out infinite;
    }
    @keyframes hint-pulse-opacity {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @keyframes character-fadein {
      0% { opacity: 0; filter: brightness(0.2) contrast(2) saturate(0); transform: scale(1.05); }
      50% { opacity: 0.6; filter: brightness(0.5) contrast(1.5) saturate(0.5); transform: scale(1.02); }
      100% { opacity: 1; filter: brightness(0.85) contrast(1.1) saturate(0.9); transform: scale(1); }
    }

    /* ===== SNIPER SCOPE CURSOR ===== */
    .sniper-cursor {
      position: fixed;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }
    .sniper-cursor.active { opacity: 1; }
    .sniper-cursor svg { width: 100%; height: 100%; }
    .sniper-cursor .scope-ring {
      animation: scope-rotate 8s linear infinite;
      transform-origin: center;
    }
    @keyframes scope-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sniper-cursor .scope-pulse {
      animation: scope-pulse 1.5s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes scope-pulse {
      0%, 100% { opacity: 0.8; r: 2; }
      50% { opacity: 1; r: 4; }
    }

    /* Click flash on character */
    .click-flash {
      position: fixed;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,217,61,0.6) 30%, transparent 70%);
      pointer-events: none;
      z-index: 10001;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
    }
    .click-flash.firing {
      animation: click-flash-burst 0.3s ease-out forwards;
    }
    @keyframes click-flash-burst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }

    /* Image edge blend — darker on left-bottom for title area, right-bottom for ENTER */
    .archive-image-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(180deg, rgba(8,8,12,0.5) 0%, transparent 20%, transparent 60%, rgba(8,8,12,0.7) 85%, rgba(8,8,12,0.95) 100%),
        linear-gradient(90deg, rgba(8,8,12,0.85) 0%, rgba(8,8,12,0.3) 25%, transparent 50%, transparent 80%, rgba(8,8,12,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Scan overlay on image */
    .archive-image-area::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 3px,
        rgba(0, 0, 0, 0.12) 3px,
        rgba(0, 0, 0, 0.12) 4px
      );
      pointer-events: none;
      z-index: 3;
    }

    /* Left vertical text */
    .archive-left-text {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(196, 181, 154, 0.5);
      letter-spacing: 0.15em;
      z-index: 4;
      white-space: nowrap;
    }

    .archive-left-text .file-num {
      color: var(--archive-stamp);
      font-weight: 700;
      opacity: 0.8;
    }

    /* Right side blocks */
    .archive-right-blocks {
      position: absolute;
      right: 8px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 4;
    }

    .archive-block {
      width: 16px;
      height: 28px;
      background: rgba(255, 217, 61, 0.08);
      border: 1px solid rgba(255, 217, 61, 0.15);
      transition: all 0.3s ease;
    }

    .archive-block.filled {
      background: rgba(255, 217, 61, 0.4);
      border-color: rgba(255, 217, 61, 0.5);
    }

    /* Top stamp */
    .archive-stamp {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--archive-stamp);
      border: 1px solid var(--archive-stamp);
      padding: 3px 10px;
      letter-spacing: 0.15em;
      opacity: 0;
      z-index: 6;
      animation: stamp-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s forwards;
    }

    @keyframes stamp-in {
      0% { opacity: 0; transform: translateX(-50%) rotate(-2deg) scale(3); }
      60% { opacity: 0.7; transform: translateX(-50%) rotate(-2deg) scale(1.1); }
      100% { opacity: 0.85; transform: translateX(-50%) rotate(-2deg) scale(1); }
    }

    /* Star decorations */
    .archive-star {
      position: absolute;
      width: 12px;
      height: 12px;
      opacity: 0;
      z-index: 4;
      animation: star-twinkle 2s ease-in-out 2s infinite;
    }

    @keyframes star-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    .star-1 { top: 15%; right: 12%; animation-delay: 2s; }
    .star-2 { top: 30%; left: 8%; animation-delay: 2.4s; }
    .star-3 { bottom: 20%; right: 15%; animation-delay: 2.8s; }
    .star-4 { bottom: 35%; left: 10%; animation-delay: 3.2s; }

    /* Bottom info bar */
    .archive-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }

    .archive-bottom-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: rgba(196, 181, 154, 0.4);
      letter-spacing: 0.15em;
    }

    /* ENTER button — right-bottom corner, minimal */
    .archive-enter {
      position: absolute;
      bottom: 20px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      opacity: 0;
      animation: fade-in 0.6s ease 2.5s forwards;
      z-index: 10;
    }

    /* Archive title — left-bottom area */
    .archive-title-area {
      position: absolute;
      bottom: 24px;
      left: 28px;
      text-align: left;
      opacity: 0;
      animation: fade-in 0.6s ease 2s forwards;
      z-index: 10;
      max-width: 45%;
    }

    .archive-title-main {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-primary);
      font-family: var(--font-mono);
      line-height: 1;
    }

    .archive-title-sub {
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.2em;
      margin-top: 8px;
      font-family: var(--font-mono);
    }

    .archive-title-tag {
      font-size: 9px;
      color: var(--archive-stamp);
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      font-family: var(--font-mono);
      opacity: 0.8;
    }

    .archive-enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: transparent;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-decoration: none;
      text-transform: uppercase;
      transition: all var(--transition-fast);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }

    .archive-enter-btn:hover {
      color: var(--zzz-yellow);
      border-color: rgba(255, 217, 61, 0.4);
      background: rgba(255, 217, 61, 0.05);
    }

    .archive-enter-hint {
      font-family: var(--font-mono);
      font-size: 8px;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* Grain texture overlay */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.04;
      background-image: 
        repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 3px);
      animation: grain-shift 8s steps(8) infinite;
    }

    @keyframes grain-shift {
      0% { transform: translate(0,0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(0,0); }
    }

    /* Random scratch */
    .scratch-flash {
      position: fixed;
      pointer-events: none;
      z-index: 998;
      opacity: 0;
    }

    /* CRT lines (archive page) */
    .crt-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 997;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 3px
      );
      opacity: 0.4;
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 996;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    }

    /* Background particles */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 217, 61, 0.15);
      border-radius: 0;
      animation: particle-fall linear infinite;
    }

    @keyframes particle-fall {
      0% { transform: translateY(-10px) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(100vh) translateX(20px); opacity: 0; }
    }

    /* Glitch flash effect */
    .glitch-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 995;
      opacity: 0;
      background: transparent;
    }

    .glitch-flash.active {
      animation: glitch-burst 0.15s steps(2) forwards;
    }

    @keyframes glitch-burst {
      0% { opacity: 0; }
      50% { opacity: 1; background: rgba(139, 26, 26, 0.05); }
      100% { opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 520px) {
      .archive-frame {
        width: 94vw;
        height: 72vh;
      }
      .archive-title-main {
        font-size: 24px;
      }
      .archive-title-area {
        max-width: 60%;
      }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .archive-frame {
        width: 88vw;
        height: 85vh;
      }
      .archive-title-main {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <!-- Sniper scope cursor -->
  <div class="sniper-cursor" id="sniper-cursor" style="left: 88px; top: 1px;">
    <svg viewBox="0 0 80 80" fill="none">

  <script>
    // ===== LOADING SEQUENCE =====
    const loadingScreen = document.getElementById('loading-screen');
    const archivePage = document.getElementById('archive-page');
    const loadBar = document.getElementById('load-bar');
    const loadNum = document.getElementById('load-num');
    const loadText = document.getElementById('load-text');
    const glitchFlash = document.getElementById('glitch-flash');
    const decodeTitle = document.getElementById('decode-title');
    const timeLabel = document.getElementById('time-label');

    // Decode text effect
    function decodeText(element, finalText, delay = 35, callback) {
      const chars = '▓░▒█▀▄■□◆◇ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let frame = 0;
      const framesPerChar = 6;
      const totalFrames = finalText.length * framesPerChar;

      const interval = setInterval(() => {
        let displayText = '';
        for (let i = 0; i < finalText.length; i++) {
          if (i < frame / framesPerChar) {
            displayText += finalText[i];
          } else {
            displayText += chars[Math.floor(Math.random() * chars.length)];
          }
        }
        element.textContent = displayText;
        frame++;
        if (frame >= totalFrames) {
          clearInterval(interval);
          element.textContent = finalText;
          if (callback) callback();
        }
      }, delay);
    }

    // Progress bar animation
    let progress = 0;
    const progressInterval = setInterval(() => {
      progress += Math.random() * 12 + 4;
      if (progress >= 100) {
        progress = 100;
        clearInterval(progressInterval);
        loadBar.style.width = '100%';
        loadNum.textContent = '100%';

        // Glitch flash
        setTimeout(() => {
          glitchFlash.classList.add('active');
          setTimeout(() => glitchFlash.classList.remove('active'), 150);
        }, 200);

        // Hide loading, show archive
        setTimeout(() => {
          loadingScreen.classList.add('hidden');
          archivePage.classList.add('active');

          // Decode the title after tear reveal
          setTimeout(() => {
            decodeText(decodeTitle, 'ELLEN YE', 30, () => {
              // RGB flash on complete
              glitchFlash.classList.add('active');
              setTimeout(() => glitchFlash.classList.remove('active'), 150);
            });
          }, 1000);
        }, 400);
        return;
      }
      loadBar.style.width = progress + '%';
      loadNum.textContent = Math.floor(progress) + '%';
    }, 120);

    // Decode loading text
    setTimeout(() => {
      decodeText(loadText, 'LOADING ARCHIVE', 25);
    }, 400);

    // ===== PARTICLES =====
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 12; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 12) + 's';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.opacity = 0.1 + Math.random() * 0.2;
      particlesContainer.appendChild(particle);
    }

    // ===== RANDOM SCRATCHES =====
    function createScratch() {
      const scratch = document.createElement('div');
      scratch.className = 'scratch-flash';
      scratch.style.position = 'fixed';
      scratch.style.left = Math.random() * 80 + 10 + '%';
      scratch.style.top = Math.random() * 80 + 10 + '%';
      scratch.style.width = '1px';
      scratch.style.height = (20 + Math.random() * 40) + 'px';
      scratch.style.background = 'rgba(255,255,255,0.15)';
      scratch.style.transform = 'rotate(' + (Math.random() * 180) + 'deg)';
      scratch.style.zIndex = '998';
      document.body.appendChild(scratch);

      scratch.animate([
        { opacity: 0 },
        { opacity: 0.6 },
        { opacity: 0 }
      ], { duration: 100 + Math.random() * 200, easing: 'steps(3)' });

      setTimeout(() => scratch.remove(), 400);
    }

    setInterval(() => {
      if (Math.random() < 0.3) createScratch();
    }, 3000);

    // ===== TIME LABEL =====
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      if (timeLabel) timeLabel.textContent = h + ':' + m + ':' + s;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // ===== SNIPER SCOPE CURSOR =====
    const sniperCursor = document.getElementById('sniper-cursor');
    const charArea = document.getElementById('char-area');
    const clickFlash = document.getElementById('click-flash');
    const rippleClick = document.getElementById('ripple-click');
    let clickLocked = false;

    // Track mouse for sniper cursor
    document.addEventListener('mousemove', (e) => {
      sniperCursor.style.left = e.clientX + 'px';
      sniperCursor.style.top = e.clientY + 'px';
    });

    // Show sniper scope only over character area
    if (charArea) {
      charArea.style.cursor = 'none';
      charArea.addEventListener('mouseenter', () => {
        sniperCursor.classList.add('active');
      });
      charArea.addEventListener('mouseleave', () => {
        sniperCursor.classList.remove('active');
      });

      // Click effect — flash + ripple, no navigation
      charArea.addEventListener('click', (e) => {
        if (clickLocked) return;
        clickLocked = true;
        setTimeout(() => { clickLocked = false; }, 400);

        // Click flash at cursor position
        clickFlash.style.left = e.clientX + 'px';
        clickFlash.style.top = e.clientY + 'px';
        clickFlash.classList.remove('firing');
        void clickFlash.offsetWidth;
        clickFlash.classList.add('firing');

        // Ripple at click position
        const rect = charArea.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        rippleClick.style.left = x + 'px';
        rippleClick.style.top = y + 'px';
        rippleClick.style.transform = 'translate(-50%, -50%)';
        rippleClick.classList.remove('active');
        void rippleClick.offsetWidth;
        rippleClick.classList.add('active');

        // Glitch flash
        if (typeof glitchFlash !== 'undefined') {
          glitchFlash.classList.add('active');
          setTimeout(() => glitchFlash.classList.remove('active'), 150);
        }
      });
    }
  </script>
