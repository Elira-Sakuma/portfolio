<!DOCTYPE html>
<!-- ============================================================
     PAGE ID: INDEX (PORTFOLIO ENTRY)
     入口页 — 点击后"瞄准射击拉近"动画跳转至 ecosystem.html
     不修改 archive-intro.html，此为独立入口页
     ============================================================ -->
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELLEN YE // PORTFOLIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-base: #08080c;
      --bg-card: #0F0F14;
      --zzz-yellow: #FFD93D;
      --neon-cyan: #00F5FF;
      --neon-purple: #B14EFF;
      --archive-red: #8B1A1A;
      --archive-cream: #C4B59A;
      --archive-stamp: #D44638;
      --archive-aged: #5A5048;
      --text-primary: #F0F0F0;
      --text-secondary: #888;
      --text-tertiary: #555;
      --font-sans: 'Inter', 'Noto Sans SC', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition-fast: 0.2s ease;
      --transition-base: 0.4s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    /* ===== CLIP PATHS ===== */
    .cut-tl-br { clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
    .cut-all-sm { clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }

    /* ===== LOADING SCREEN ===== */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .load-scan {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--zzz-yellow), transparent);
      opacity: 0;
      animation: scan-sweep 0.8s ease-out forwards;
    }
    @keyframes scan-sweep {
      0% { top: 0; opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { top: 100%; opacity: 0; }
    }

    .load-text {
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.3em;
      color: var(--zzz-yellow);
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0;
      animation: fade-in 0.4s ease 0.3s forwards;
      min-height: 20px;
    }
    .load-text-cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--zzz-yellow);
      margin-left: 4px;
      animation: blink 0.6s steps(2) infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fade-in { to { opacity: 1; } }

    .load-progress-wrap {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      opacity: 0;
      animation: fade-in 0.4s ease 0.6s forwards;
    }
    .load-progress-bar {
      width: 0%;
      height: 100%;
      background: var(--zzz-yellow);
      transition: width 0.3s ease;
    }
    .load-progress-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 12px;
      letter-spacing: 0.2em;
      opacity: 0;
      animation: fade-in 0.4s ease 0.6s forwards;
    }

    .load-crt {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255, 255, 255, 0.02) 2px, rgba(255, 255, 255, 0.02) 3px);
    }

    /* ===== ARCHIVE PAGE ===== */
    #archive-page {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }
    #archive-page.active {
      opacity: 1;
      visibility: visible;
    }

    /* The container that will be animated on click (zoom-in) */
    .archive-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
      animation: tear-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      transition: transform 0s, filter 0s, opacity 0s;
    }
    #archive-page.active .archive-inner {
      animation: tear-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Zoom-in state — triggered on click */
    .archive-inner.zooming {
      animation: none;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      transform: scale(12);
      filter: brightness(2);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.6s ease, opacity 0.4s ease 0.2s;
    }

    @keyframes tear-reveal {
      0% {
        clip-path: polygon(0 100%, 100% 100%, 100% 98%, 0 100%);
        transform: translateY(20px);
        filter: brightness(0.3) contrast(1.5);
      }
      40% {
        clip-path: polygon(0 100%, 100% 100%, 100% 50%, 0 55%);
        transform: translateY(10px);
        filter: brightness(0.7) contrast(1.2);
      }
      60% {
        clip-path: polygon(0 100%, 100% 100%, 100% 30%, 0 35%);
        transform: translateY(3px) translateX(-1px);
        filter: brightness(0.9);
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transform: translateY(0);
        filter: brightness(1);
      }
    }

    /* Archive frame */
    .archive-frame {
      position: relative;
      width: 90vw;
      max-width: 1400px;
      height: 88vh;
      max-height: 820px;
      background: var(--bg-card);
    }

    /* Decorative corners */
    .archive-corner {
      position: absolute;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 5;
    }
    .archive-corner svg { width: 100%; height: 100%; }
    .corner-tl { top: -1px; left: -1px; }
    .corner-tr { top: -1px; right: -1px; transform: scaleX(-1); }
    .corner-bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
    .corner-br { bottom: -1px; right: -1px; transform: scale(-1, -1); }

    /* Main image area */
    .archive-image-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0e 0%, #12121a 50%, #0d0d12 100%);
    }

    /* Character video — breathing live effect */
    .archive-character {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 65% 25%;
      filter: brightness(0.8) contrast(1.15) saturate(0.85);
      animation: character-fadein 1s ease 0.8s both;
    }

    /* Ripple guide */
    .ripple-guide {
      position: absolute;
      top: 30%;
      left: 58%;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.4s ease;
      transform: translate(-50%, -50%);
      animation: eye-track 6s ease-in-out infinite;
    }
    .archive-image-area:hover .ripple-guide { opacity: 1; }

    @keyframes eye-track {
      0%   { transform: translate(-50%, -50%) translate(0px, 0px); }
      15%  { transform: translate(-50%, -50%) translate(3px, -2px); }
      30%  { transform: translate(-50%, -50%) translate(5px, 1px); }
      45%  { transform: translate(-50%, -50%) translate(2px, 3px); }
      50%  { transform: translate(-50%, -50%) translate(0px, 2px); }
      65%  { transform: translate(-50%, -50%) translate(-3px, 0px); }
      80%  { transform: translate(-50%, -50%) translate(-4px, -2px); }
      100% { transform: translate(-50%, -50%) translate(0px, 0px); }
    }

    .ripple-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border: 1.5px solid rgba(255, 217, 61, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: ripple-expand 2s ease-out infinite;
    }
    .ripple-ring:nth-child(2) { animation-delay: 0.6s; }
    .ripple-ring:nth-child(3) { animation-delay: 1.2s; }

    @keyframes ripple-expand {
      0% { width: 20px; height: 20px; border-color: rgba(255, 217, 61, 0.7); opacity: 0.8; }
      100% { width: 120px; height: 120px; border-color: rgba(255, 217, 61, 0.05); opacity: 0; }
    }

    /* Click pulse */
    .ripple-click {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid var(--zzz-yellow);
      border-radius: 50%;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transform: translate(-50%, -50%);
    }
    .ripple-click.active { animation: click-burst 0.6s ease-out forwards; }

    @keyframes click-burst {
      0% { width: 40px; height: 40px; opacity: 1; border-width: 2px; }
      100% { width: 200px; height: 200px; opacity: 0; border-width: 1px; }
    }

    /* Cursor hint */
    .cursor-hint {
      position: absolute;
      top: 30%;
      left: 58%;
      width: 32px;
      height: 32px;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      animation: eye-track 6s ease-in-out infinite;
    }
    .archive-image-area:hover .cursor-hint {
      opacity: 0.6;
      animation: eye-track 6s ease-in-out infinite, hint-pulse-opacity 1.5s ease-in-out infinite;
    }
    @keyframes hint-pulse-opacity {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @keyframes character-fadein {
      0% { opacity: 0; filter: brightness(0.2) contrast(2) saturate(0); transform: scale(1.05); }
      50% { opacity: 0.6; filter: brightness(0.5) contrast(1.5) saturate(0.5); transform: scale(1.02); }
      100% { opacity: 1; filter: brightness(0.85) contrast(1.1) saturate(0.9); transform: scale(1); }
    }

    /* ===== SNIPER SCOPE CURSOR ===== */
    .sniper-cursor {
      position: fixed;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }
    .sniper-cursor.active { opacity: 1; }
    .sniper-cursor svg { width: 100%; height: 100%; }
    .sniper-cursor .scope-ring {
      animation: scope-rotate 8s linear infinite;
      transform-origin: center;
    }
    @keyframes scope-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Click flash on character */
    .click-flash {
      position: fixed;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,217,61,0.6) 30%, transparent 70%);
      pointer-events: none;
      z-index: 10001;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
    }
    .click-flash.firing {
      animation: click-flash-burst 0.3s ease-out forwards;
    }
    @keyframes click-flash-burst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }

    /* ===== SHOOT + ZOOM TRANSITION ===== */
    /* Screen shake on shoot */
    .screen-shake {
      animation: screen-shake 0.4s ease-out forwards;
    }
    @keyframes screen-shake {
      0% { transform: translate(0, 0); }
      10% { transform: translate(-8px, 4px); }
      20% { transform: translate(6px, -3px); }
      30% { transform: translate(-4px, 2px); }
      40% { transform: translate(3px, -1px); }
      50% { transform: translate(-2px, 1px); }
      60% { transform: translate(1px, 0px); }
      100% { transform: translate(0, 0); }
    }

    /* White flash overlay */
    .white-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 10002;
      pointer-events: none;
      opacity: 0;
    }
    .white-flash.firing {
      animation: white-flash-burst 0.5s ease-out forwards;
    }
    @keyframes white-flash-burst {
      0% { opacity: 0; }
      15% { opacity: 0; }
      20% { opacity: 1; }
      100% { opacity: 1; }
    }

    /* Scope zoom vignette — dark ring closing in */
    .scope-vignette {
      position: fixed;
      inset: 0;
      z-index: 10001;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 70%, #000 100%);
    }
    .scope-vignette.firing {
      animation: scope-close 0.6s ease-in forwards;
    }
    @keyframes scope-close {
      0% { opacity: 0; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0) 70%, rgba(0,0,0,0) 100%); }
      50% { opacity: 1; background: radial-gradient(circle at center, transparent 15%, rgba(0,0,0,0.6) 40%, #000 70%); }
      100% { opacity: 1; background: radial-gradient(circle at center, transparent 0%, #000 30%, #000 100%); }
    }

    /* Image edge blend */
    .archive-image-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8,8,12,0.5) 0%, transparent 20%, transparent 60%, rgba(8,8,12,0.7) 85%, rgba(8,8,12,0.95) 100%),
        linear-gradient(90deg, rgba(8,8,12,0.85) 0%, rgba(8,8,12,0.3) 25%, transparent 50%, transparent 80%, rgba(8,8,12,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Scan overlay */
    .archive-image-area::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(0, 0, 0, 0.12) 3px, rgba(0, 0, 0, 0.12) 4px);
      pointer-events: none;
      z-index: 3;
    }

    /* Left vertical text */
    .archive-left-text {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(196, 181, 154, 0.5);
      letter-spacing: 0.15em;
      z-index: 4;
      white-space: nowrap;
    }
    .archive-left-text .file-num {
      color: var(--archive-stamp);
      font-weight: 700;
      opacity: 0.8;
    }

    /* Right side blocks */
    .archive-right-blocks {
      position: absolute;
      right: 8px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 4;
    }
    .archive-block {
      width: 16px;
      height: 28px;
      background: rgba(255, 217, 61, 0.08);
      border: 1px solid rgba(255, 217, 61, 0.15);
      transition: all 0.3s ease;
    }
    .archive-block.filled {
      background: rgba(255, 217, 61, 0.4);
      border-color: rgba(255, 217, 61, 0.5);
    }

    /* Bottom bar */
    .archive-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    .archive-bottom-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: rgba(196, 181, 154, 0.4);
      letter-spacing: 0.15em;
    }

    /* ENTER button */
    .archive-enter {
      position: absolute;
      bottom: 20px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      opacity: 0;
      animation: fade-in 0.6s ease 2.5s forwards;
      z-index: 10;
    }

    /* Archive title */
    .archive-title-area {
      position: absolute;
      bottom: 24px;
      left: 28px;
      text-align: left;
      opacity: 0;
      animation: fade-in 0.6s ease 2s forwards;
      z-index: 10;
      max-width: 45%;
    }
    .archive-title-main {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-primary);
      font-family: var(--font-mono);
      line-height: 1;
    }
    .archive-title-sub {
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.2em;
      margin-top: 8px;
      font-family: var(--font-mono);
    }
    .archive-title-tag {
      font-size: 9px;
      color: var(--archive-stamp);
      letter-spacing: 0.15em;
      margin-bottom: 6px;
      font-family: var(--font-mono);
      opacity: 0.8;
    }

    .archive-enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: transparent;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-decoration: none;
      text-transform: uppercase;
      transition: all var(--transition-fast);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .archive-enter-btn:hover {
      color: var(--zzz-yellow);
      border-color: rgba(255, 217, 61, 0.4);
      background: rgba(255, 217, 61, 0.05);
    }
    .archive-enter-hint {
      font-family: var(--font-mono);
      font-size: 8px;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* Top stamp */
    .archive-stamp {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--archive-stamp);
      border: 1px solid var(--archive-stamp);
      padding: 3px 10px;
      letter-spacing: 0.15em;
      opacity: 0;
      z-index: 6;
      animation: stamp-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s forwards;
    }
    @keyframes stamp-in {
      0% { opacity: 0; transform: translateX(-50%) rotate(-2deg) scale(3); }
      60% { opacity: 0.7; transform: translateX(-50%) rotate(-2deg) scale(1.1); }
      100% { opacity: 0.85; transform: translateX(-50%) rotate(-2deg) scale(1); }
    }

    /* Star decorations */
    .archive-star {
      position: absolute;
      width: 12px;
      height: 12px;
      opacity: 0;
      z-index: 4;
      animation: star-twinkle 2s ease-in-out 2s infinite;
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .star-1 { top: 15%; right: 12%; animation-delay: 2s; }
    .star-2 { top: 30%; left: 8%; animation-delay: 2.4s; }
    .star-3 { bottom: 20%; right: 15%; animation-delay: 2.8s; }
    .star-4 { bottom: 35%; left: 10%; animation-delay: 3.2s; }

    /* Grain texture overlay */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.04;
      background-image: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 3px);
      animation: grain-shift 8s steps(8) infinite;
    }
    @keyframes grain-shift {
      0% { transform: translate(0,0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(0,0); }
    }

    /* CRT lines */
    .crt-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 997;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0, 0, 0, 0.08) 2px, rgba(0, 0, 0, 0.08) 3px);
      opacity: 0.4;
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 996;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    }

    /* Background particles */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 217, 61, 0.15);
      border-radius: 0;
      animation: particle-fall linear infinite;
    }
    @keyframes particle-fall {
      0% { transform: translateY(-10px) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(100vh) translateX(20px); opacity: 0; }
    }

    /* Glitch flash */
    .glitch-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 995;
      opacity: 0;
      background: transparent;
    }
    .glitch-flash.active {
      animation: glitch-burst 0.15s steps(2) forwards;
    }
    @keyframes glitch-burst {
      0% { opacity: 0; }
      50% { opacity: 1; background: rgba(139, 26, 26, 0.05); }
      100% { opacity: 0; }
    }

    /* ===== ENTER TOOLTIP — "CLICK TO ENTER" ===== */
    .enter-tooltip {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--zzz-yellow);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      z-index: 100;
      opacity: 0;
      animation: fade-in 0.6s ease 3s forwards, tooltip-pulse 2s ease-in-out 3.5s infinite;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
    }
    @keyframes tooltip-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .enter-tooltip .blink-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--zzz-yellow);
      border-radius: 50%;
      margin-right: 8px;
      animation: blink 1s steps(2) infinite;
      vertical-align: middle;
    }

    /* Responsive */
    @media (max-width: 520px) {
      .archive-frame { width: 94vw; height: 72vh; }
      .archive-title-main { font-size: 24px; }
      .archive-title-area { max-width: 60%; }
    }
    @media (orientation: landscape) and (max-height: 600px) {
      .archive-frame { width: 88vw; height: 85vh; }
      .archive-title-main { font-size: 28px; }
    }
  </style>
</head>

  <!-- ===== LOADING SCREEN ===== -->

  <!-- ===== ARCHIVE PAGE ===== -->
  <div id="archive-page">

    <!-- Archive frame -->
    <div class="archive-inner" id="archive-inner">
      <div class="archive-frame cut-tl-br">

        <!-- Decorative corners -->

          <svg viewBox="0 0 32 32" fill="none">
            <path d="M0 12 L0 0 L12 0" stroke="rgba(255,217,61,0.3)" stroke-width="1.5"></path>

            <circle cx="6" cy="6" r="1" fill="rgba(255,217,61,0.2)"></circle>

        <div class="archive-corner corner-bl">
          <svg viewBox="0 0 32 32" fill="none">

          </svg>
        </div>
        <div class="archive-corner corner-br">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M0 12 L0 0 L12 0" stroke="rgba(255,217,61,0.3)" stroke-width="1.5"></path>

        <!-- Top stamp -->
        <div class="archive-stamp">CLASSIFIED // ARCHIVE 2026</div>

        <!-- Main image area -->

          <video class="archive-character" autoplay muted loop playsinline poster="ellen-portrait.png">

          <div class="ripple-click" id="ripple-click"></div>

          <svg class="cursor-hint" viewBox="0 0 32 32" fill="none">

        <!-- Right side blocks -->
        <div class="archive-right-blocks">
          <div class="archive-block filled"></div>

        <svg class="archive-star star-1" viewBox="0 0 12 12" fill="none">

        </svg>
        <svg class="archive-star star-2" viewBox="0 0 12 12" fill="none">
          <path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="rgba(196,181,154,0.25)"></path>
        </svg>
        <svg class="archive-star star-3" viewBox="0 0 12 12" fill="none">
          <path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="rgba(255,217,61,0.2)"></path>
        </svg>
        <svg class="archive-star star-4" viewBox="0 0 12 12" fill="none">
          <path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="rgba(196,181,154,0.15)"></path>
        </svg>

        <!-- Bottom bar -->
        <div class="archive-bottom-bar">
          <span class="archive-bottom-label">REC // ARCHIVE</span>
          <span class="archive-bottom-label" id="time-label">00:00:00</span>
        </div>
      </div>
    </div>

    <!-- Title -->
    <div class="archive-title-area">
      <div class="archive-title-tag">// FILE 01</div>
      <div class="archive-title-main" id="decode-title">ELLEN YE</div>
      <div class="archive-title-sub">CONTENT ECOSYSTEM × GAME INSIGHTS</div>
    </div>

    <!-- ENTER -->
    <div class="archive-enter">
      <span class="archive-enter-btn">ARCHIVE // ELLEN</span>
      <span class="archive-enter-hint">CLICK TO ENTER</span>

  <!-- Click to enter tooltip -->
  <div class="enter-tooltip">
    <span class="blink-dot"></span>CLICK TO ENTER
  </div>

  <!-- Overlays -->
  <div class="grain-overlay"></div>
  <div class="crt-lines"></div>
  <div class="vignette"></div>
  <div class="glitch-flash" id="glitch-flash"></div>

  <script>
    // ===== LOADING SEQUENCE =====
    var loadingScreen = document.getElementById('loading-screen');
    var archivePage = document.getElementById('archive-page');
    var loadBar = document.getElementById('load-bar');
    var loadNum = document.getElementById('load-num');
    var loadText = document.getElementById('load-text');
    var glitchFlash = document.getElementById('glitch-flash');
    var decodeTitle = document.getElementById('decode-title');
    var timeLabel = document.getElementById('time-label');

    // Decode text effect
    function decodeText(element, finalText, delay, callback) {
      delay = delay || 35;
      var chars = '\u2593\u2591\u2592\u2588\u2580\u2584\u25a0\u25a1\u25c6\u25c7ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      var frame = 0;
      var framesPerChar = 6;
      var totalFrames = finalText.length * framesPerChar;

      var interval = setInterval(function() {
        var displayText = '';
        for (var i = 0; i < finalText.length; i++) {
          if (i < frame / framesPerChar) {
            displayText += finalText[i];
          } else {
            displayText += chars[Math.floor(Math.random() * chars.length)];
          }
        }
        element.textContent = displayText;
        frame++;
        if (frame >= totalFrames) {
          clearInterval(interval);
          element.textContent = finalText;
          if (callback) callback();
        }
      }, delay);
    }

    // Progress bar
    var progress = 0;
    var progressInterval = setInterval(function() {
      progress += Math.random() * 12 + 4;
      if (progress >= 100) {
        progress = 100;
        clearInterval(progressInterval);
        loadBar.style.width = '100%';
        loadNum.textContent = '100%';

        setTimeout(function() {
          glitchFlash.classList.add('active');
          setTimeout(function() { glitchFlash.classList.remove('active'); }, 150);
        }, 200);

        setTimeout(function() {
          loadingScreen.classList.add('hidden');
          archivePage.classList.add('active');

          setTimeout(function() {
            decodeText(decodeTitle, 'ELLEN YE', 30, function() {
              glitchFlash.classList.add('active');
              setTimeout(function() { glitchFlash.classList.remove('active'); }, 150);
            });
          }, 1000);
        }, 400);
        return;
      }
      loadBar.style.width = progress + '%';
      loadNum.textContent = Math.floor(progress) + '%';
    }, 120);

    // Decode loading text
    setTimeout(function() {
      decodeText(loadText, 'LOADING ARCHIVE', 25);
    }, 400);

    // ===== PARTICLES =====
    var particlesContainer = document.getElementById('particles');
    for (var i = 0; i < 12; i++) {
      var particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 12) + 's';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.opacity = 0.1 + Math.random() * 0.2;
      particlesContainer.appendChild(particle);
    }

    // ===== TIME LABEL =====
    function updateTime() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      var s = String(now.getSeconds()).padStart(2, '0');
      if (timeLabel) timeLabel.textContent = h + ':' + m + ':' + s;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // ===== SNIPER SCOPE CURSOR =====
    var sniperCursor = document.getElementById('sniper-cursor');
    var charArea = document.getElementById('char-area');
    var clickFlash = document.getElementById('click-flash');
    var rippleClick = document.getElementById('ripple-click');
    var archiveInner = document.getElementById('archive-inner');
    var scopeVignette = document.getElementById('scope-vignette');
    var whiteFlash = document.getElementById('white-flash');
    var entered = false;

    // Track mouse for sniper cursor
    document.addEventListener('mousemove', function(e) {
      sniperCursor.style.left = e.clientX + 'px';
      sniperCursor.style.top = e.clientY + 'px';
    });

    // Show sniper scope only over character area
    if (charArea) {
      charArea.style.cursor = 'none';
      charArea.addEventListener('mouseenter', function() {
        sniperCursor.classList.add('active');
      });
      charArea.addEventListener('mouseleave', function() {
        sniperCursor.classList.remove('active');
      });

      // ===== CLICK: AIM → SHOOT → ZOOM IN → REDIRECT =====
      charArea.addEventListener('click', function(e) {
        if (entered) return;
        entered = true;

        // 1. Click flash at cursor position
        clickFlash.style.left = e.clientX + 'px';
        clickFlash.style.top = e.clientY + 'px';
        clickFlash.classList.remove('firing');
        void clickFlash.offsetWidth;
        clickFlash.classList.add('firing');

        // 2. Ripple at click position
        var rect = charArea.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        rippleClick.style.left = x + 'px';
        rippleClick.style.top = y + 'px';
        rippleClick.style.transform = 'translate(-50%, -50%)';
        rippleClick.classList.remove('active');
        void rippleClick.offsetWidth;
        rippleClick.classList.add('active');

        // 3. Glitch flash
        glitchFlash.classList.add('active');
        setTimeout(function() { glitchFlash.classList.remove('active'); }, 150);

        // 4. Screen shake (recoil)
        document.body.classList.add('screen-shake');
        setTimeout(function() { document.body.classList.remove('screen-shake'); }, 400);

        // 5. Scope vignette closing in
        setTimeout(function() {
          scopeVignette.classList.add('firing');
        }, 200);

        // 6. Zoom in the archive content
        setTimeout(function() {
          archiveInner.classList.add('zooming');
        }, 300);

        // 7. White flash
        setTimeout(function() {
          whiteFlash.classList.add('firing');
        }, 500);

        // 8. Redirect to ecosystem.html
        setTimeout(function() {
          window.location.href = 'ecosystem.html';
        }, 900);
      });
    }

    // Also allow clicking the ENTER button
    var enterBtn = document.querySelector('.archive-enter-btn');
    if (enterBtn) {
      enterBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (entered) return;
        entered = true;

        // Simulate the same sequence from center
        var centerX = window.innerWidth / 2;
        var centerY = window.innerHeight / 2;

        clickFlash.style.left = centerX + 'px';
        clickFlash.style.top = centerY + 'px';
        clickFlash.classList.remove('firing');
        void clickFlash.offsetWidth;
        clickFlash.classList.add('firing');

        glitchFlash.classList.add('active');
        setTimeout(function() { glitchFlash.classList.remove('active'); }, 150);

        document.body.classList.add('screen-shake');
        setTimeout(function() { document.body.classList.remove('screen-shake'); }, 400);

        setTimeout(function() {
          scopeVignette.classList.add('firing');
        }, 200);

        setTimeout(function() {
          archiveInner.classList.add('zooming');
        }, 300);

        setTimeout(function() {
          whiteFlash.classList.add('firing');
        }, 500);

        setTimeout(function() {
          window.location.href = 'ecosystem.html';
        }, 900);
      });
    }
  </script>
</body></html>
